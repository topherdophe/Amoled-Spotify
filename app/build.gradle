plugins { id 'com.android.application' }

// Client ID comes from the SPOTIFY_CLIENT_ID environment variable (set by the GitHub Action from the
// repository variable) or a Gradle property (-PSPOTIFY_CLIENT_ID=... or ~/.gradle/gradle.properties).
def spotifyClientId = (System.getenv('SPOTIFY_CLIENT_ID') ?: project.findProperty('SPOTIFY_CLIENT_ID') ?: 'REPLACE_WITH_SPOTIFY_CLIENT_ID').toString().trim()

android {
    namespace 'com.example.neonspotify'
    compileSdk 35
    defaultConfig {
        applicationId 'com.example.neonspotify'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0'
        resValue 'string', 'spotify_client_id', spotifyClientId
    }
    buildFeatures { resValues true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
