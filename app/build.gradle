plugins { id 'com.android.application' }

// Optional default Client ID (the app also lets you enter one). Comes from the SPOTIFY_CLIENT_ID
// environment variable (GitHub Action) or a Gradle property (-PSPOTIFY_CLIENT_ID=...).
def spotifyClientId = (System.getenv('SPOTIFY_CLIENT_ID') ?: project.findProperty('SPOTIFY_CLIENT_ID') ?: 'REPLACE_WITH_SPOTIFY_CLIENT_ID').toString().trim()

// Permanent signing key, so new builds install over old ones. The GitHub Action writes the keystore
// from repository secrets; without them the build falls back to a throwaway debug key.
def keystorePath = System.getenv('SIGNING_KEYSTORE_PATH')
def hasSigningKey = keystorePath != null && new File(keystorePath).exists()

// Each GitHub build gets a higher version number so Android accepts it as an update.
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '3').toInteger()

android {
    namespace 'com.topherdophe.neon'
    compileSdk 35
    defaultConfig {
        applicationId 'com.topherdophe.neon'
        minSdk 26
        targetSdk 35
        versionCode buildNumber
        versionName "3.0.${buildNumber}"
        resValue 'string', 'spotify_client_id', spotifyClientId
    }
    signingConfigs {
        neon {
            if (hasSigningKey) {
                storeFile file(keystorePath)
                storeType 'pkcs12'
                storePassword System.getenv('SIGNING_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            if (hasSigningKey) signingConfig signingConfigs.neon
        }
        // What GitHub builds: a normal (not debuggable) app, signed with the same permanent key,
        // so it installs over earlier debug builds. Without the key it falls back to the debug key.
        release {
            minifyEnabled false
            signingConfig hasSigningKey ? signingConfigs.neon : signingConfigs.debug
        }
    }
    buildFeatures { resValues true }
    // Android's code checker. Errors fail the GitHub build; warnings are only reported.
    lint {
        abortOnError true
        warningsAsErrors false
        checkReleaseBuilds false
        xmlReport true
        htmlReport true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
