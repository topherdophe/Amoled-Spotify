name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build APK
        env:
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
        run: |
          if [ -z "$SPOTIFY_CLIENT_ID" ]; then
            echo "::warning::SPOTIFY_CLIENT_ID repository variable is not set. The app will build but can't log in."
          fi
          if ! gradle assembleDebug --no-daemon --console=plain > build.log 2>&1; then
            cat build.log
            # Surface compiler errors as an annotation on the run summary.
            msg=$(grep -E "error:|e: |What went wrong|Exception" -A2 build.log | head -40 | sed -e 's/%/%25/g' | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')
            echo "::error title=Gradle build failed::${msg}"
            exit 1
          fi
          tail -5 build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Amoled-Spotify-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
