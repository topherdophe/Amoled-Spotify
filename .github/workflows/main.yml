
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -q NeonSpotifyController.zip -d extracted

      - name: Configure Spotify Client ID
        env:
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from xml.sax.saxutils import escape

          client_id = os.environ.get("SPOTIFY_CLIENT_ID", "").strip()
          if not client_id:
              raise SystemExit("Missing SPOTIFY_CLIENT_ID repository variable")

          files = list(Path("extracted").rglob("strings.xml"))
          if len(files) != 1:
              raise SystemExit("Expected exactly one strings.xml")

          path = files[0]
          content = path.read_text()
          placeholder = "REPLACE_WITH_SPOTIFY_CLIENT_ID"

          if placeholder not in content:
              raise SystemExit("Client ID placeholder not found")

          path.write_text(
              content.replace(placeholder, escape(client_id))
          )
          print("Spotify Client ID configured")
          PY

      - name: Build Android APK
        run: |
          PROJECT=$(find extracted -name settings.gradle -printf '%h\n' | head -1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          cd "$PROJECT"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Amoled-Spotify-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
