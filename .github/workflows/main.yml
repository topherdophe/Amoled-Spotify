name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Prepare signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/neon-release.p12"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/neon-release.p12" >> "$GITHUB_ENV"
            echo "Signing with the permanent key"
          else
            echo "::warning::Signing secrets not set: this APK uses a throwaway key and won't install over a previous build."
          fi

      - name: Build APK
        env:
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          if [ -z "$SPOTIFY_CLIENT_ID" ]; then
            echo "::notice::SPOTIFY_CLIENT_ID repository variable is not set. The app will ask for the Client ID on first launch."
          fi
          if ! gradle assembleRelease --no-daemon --console=plain > build.log 2>&1; then
            cat build.log
            # Surface compiler errors as an annotation on the run summary.
            msg=$(grep -E "error:|e: |What went wrong|Exception" -A2 build.log | head -40 | sed -e 's/%/%25/g' | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')
            echo "::error title=Gradle build failed::${msg}"
            exit 1
          fi
          tail -5 build.log
          rm -f "$RUNNER_TEMP/neon-release.p12"

      - name: Check code (lint)
        run: |
          if gradle lintDebug --no-daemon --console=plain > lint.log 2>&1; then
            tail -3 lint.log
          else
            tail -40 lint.log
            failed=1
          fi
          REPORT=app/build/reports/lint-results-debug.xml
          if [ -f "$REPORT" ]; then
            # Each lint error becomes an annotation on the file and line; warnings are counted only.
            python3 - "$REPORT" <<'PY'
          import sys, xml.etree.ElementTree as ET
          issues = ET.parse(sys.argv[1]).getroot().findall('issue')
          errors = [i for i in issues if i.get('severity') in ('Error', 'Fatal')]
          for i in errors:
              loc = i.find('location')
              f = l = ''
              if loc is not None:
                  f = loc.get('file', '').split('/Amoled-Spotify/')[-1]
                  l = loc.get('line', '')
              msg = (i.get('id', '') + ': ' + i.get('message', '')).replace('%', '%25').replace(chr(10), '%0A')
              print(f"::error file={f},line={l},title=Lint::{msg}")
          print(f"::notice title=Lint::{len(errors)} errors, {len(issues) - len(errors)} warnings")
          PY
          fi
          [ -z "$failed" ]

      - name: Show signing certificate
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          SHA=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | grep -m1 "SHA-256 digest" | awk '{print $NF}')
          echo "::notice title=Signing certificate SHA-256::$SHA"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Amoled-Spotify-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
