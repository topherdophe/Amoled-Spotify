
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -q NeonSpotifyController.zip -d extracted
          find extracted -name settings.gradle.kts

      - name: Build Android APK
        run: |
          PROJECT=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          cd "$PROJECT"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Minimalist-Black-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
